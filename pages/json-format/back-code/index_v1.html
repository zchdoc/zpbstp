<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter | JSON 格式化工具</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-yellow: #d29922;
      --accent-purple: #a371f7;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      font-family: var(--font-mono);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--border-color);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
    }

    .btn-primary:hover {
      background: #4393e6;
      border-color: #4393e6;
    }

    .btn-success {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: white;
    }

    .btn-success:hover {
      background: #36a146;
      border-color: #36a146;
    }

    /* Toolbar */
    .toolbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border-color);
      margin: 0 8px;
    }

    .mode-toggle {
      display: flex;
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 3px;
      border: 1px solid var(--border-color);
    }

    .mode-toggle button {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .mode-toggle button.active {
      background: var(--accent-blue);
      color: white;
    }

    .mode-toggle button:hover:not(.active) {
      color: var(--text-primary);
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-left: auto;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .stat-dot.keys { background: var(--accent-blue); }
    .stat-dot.depth { background: var(--accent-purple); }
    .stat-dot.size { background: var(--accent-green); }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      padding: 0;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel:first-child {
      border-right: 1px solid var(--border-color);
    }

    .panel-header {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title .icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .panel:first-child .panel-title .icon {
      background: var(--accent-red);
    }

    .panel:last-child .panel-title .icon {
      background: var(--accent-green);
    }

    .panel-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-size: 14px;
    }

    .icon-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .icon-btn.success:hover {
      background: rgba(63, 185, 80, 0.15);
      color: var(--accent-green);
    }

    .icon-btn.danger:hover {
      background: rgba(248, 81, 73, 0.15);
      color: var(--accent-red);
    }

    .textarea-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .json-textarea {
      width: 100%;
      height: 100%;
      padding: 16px;
      background: var(--bg-primary);
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .json-textarea::placeholder {
      color: var(--text-muted);
    }

    /* Syntax Highlight Layer */
    .syntax-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: auto;
      pointer-events: none;
      color: transparent;
    }

    .syntax-layer .string { color: #a5d6ff; }
    .syntax-layer .number { color: #79c0ff; }
    .syntax-layer .boolean { color: #ff7b72; }
    .syntax-layer .null { color: #ff7b72; }
    .syntax-layer .key { color: #7ee787; }
    .syntax-layer .punctuation { color: var(--text-secondary); }

    /* Error Display */
    .error-bar {
      background: rgba(248, 81, 73, 0.1);
      border-top: 1px solid rgba(248, 81, 73, 0.3);
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--accent-red);
    }

    .error-bar.visible {
      display: flex;
    }

    .error-bar .icon {
      flex-shrink: 0;
    }

    /* Status Bar */
    .status-bar {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-item kbd {
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 10px;
      border: 1px solid var(--border-color);
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .format-time {
      color: var(--accent-green);
    }

    /* Keyboard Shortcuts Modal */
    .shortcuts-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .shortcuts-overlay.visible {
      display: flex;
    }

    .shortcuts-modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .shortcuts-modal h3 {
      font-size: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .shortcut-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .shortcut-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shortcut-item span {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .shortcut-item kbd {
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: var(--accent-green);
    }

    .toast.success .toast-icon {
      color: var(--accent-green);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .panel:first-child {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        height: 50%;
      }

      .panel:last-child {
        height: 50%;
      }

      .stats {
        display: none;
      }

      .header {
        padding: 12px 16px;
      }

      .toolbar {
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">{}</div>
      <div class="logo-text">JSON Formatter <span>/ 格式化工具</span></div>
    </div>
    <div class="header-actions">
      <button class="btn" id="shortcutsBtn" title="快捷键">
        <span>⌨</span> 快捷键
      </button>
      <button class="btn" id="importBtn" title="导入文件">
        <span>📁</span> 导入
      </button>
      <button class="btn btn-success" id="exportBtn" title="导出文件">
        <span>💾</span> 导出
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tool-group">
      <button class="btn btn-primary" id="formatBtn">
        <span>⚡</span> 格式化
      </button>
      <button class="btn" id="compressBtn">
        <span>≋</span> 压缩
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tool-group">
      <div class="mode-toggle">
        <button id="beautifyMode" class="active">美化</button>
        <button id="minifyMode">压缩</button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tool-group">
      <button class="btn" id="clearBtn" title="清空所有">
        <span>🗑</span> 清空
      </button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-dot keys"></span>
        <span id="keyCount">0</span> 键
      </div>
      <div class="stat-item">
        <span class="stat-dot depth"></span>
        <span id="maxDepth">0</span> 层
      </div>
      <div class="stat-item">
        <span class="stat-dot size"></span>
        <span id="charCount">0</span> 字符
      </div>
    </div>
  </div>

  <main class="main">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="icon">IN</span>
          输入 JSON
        </div>
        <div class="panel-actions">
          <button class="icon-btn success" id="pasteBtn" title="粘贴 (Ctrl+V)">📋</button>
          <button class="icon-btn" id="loadSampleBtn" title="加载示例">�示例</button>
        </div>
      </div>
      <div class="textarea-wrapper">
        <textarea 
          class="json-textarea" 
          id="inputJson"
          placeholder="在此粘贴或输入 JSON...&#10;&#10;支持转义字符和嵌套 JSON&#10;按 Ctrl+Enter 快速格式化"
          spellcheck="false"
        ></textarea>
      </div>
      <div class="error-bar" id="inputError">
        <span class="icon">⚠</span>
        <span id="errorMessage"></span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="icon">OUT</span>
          输出结果
        </div>
        <div class="panel-actions">
          <button class="icon-btn success" id="copyBtn" title="复制 (Ctrl+C)">📋</button>
          <button class="icon-btn danger" id="clearOutputBtn" title="清空">✕</button>
        </div>
      </div>
      <div class="textarea-wrapper">
        <textarea 
          class="json-textarea" 
          id="outputJson"
          placeholder="格式化后的 JSON 将显示在这里..."
          spellcheck="false"
          readonly
        ></textarea>
      </div>
    </div>
  </main>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-item">
        <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 格式化
      </div>
      <div class="status-item">
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> 复制输出
      </div>
      <div class="status-item">
        <kbd>?</kbd> 快捷键
      </div>
    </div>
    <div class="status-right">
      <span id="formatStatus"></span>
      <span class="format-time" id="formatTime"></span>
    </div>
  </div>

  <!-- Shortcuts Modal -->
  <div class="shortcuts-overlay" id="shortcutsOverlay">
    <div class="shortcuts-modal">
      <h3>⌨ 快捷键</h3>
      <div class="shortcut-list">
        <div class="shortcut-item">
          <span>格式化 JSON</span>
          <kbd>Ctrl + Enter</kbd>
        </div>
        <div class="shortcut-item">
          <span>复制输出</span>
          <kbd>Ctrl + Shift + C</kbd>
        </div>
        <div class="shortcut-item">
          <span>粘贴到输入</span>
          <kbd>Ctrl + V</kbd>
        </div>
        <div class="shortcut-item">
          <span>清空所有</span>
          <kbd>Ctrl + L</kbd>
        </div>
        <div class="shortcut-item">
          <span>关闭弹窗</span>
          <kbd>Esc</kbd>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-message"></span>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept=".json,.txt" style="display: none;">

  <script>
    // DOM Elements
    const inputJson = document.getElementById('inputJson');
    const outputJson = document.getElementById('outputJson');
    const formatBtn = document.getElementById('formatBtn');
    const compressBtn = document.getElementById('compressBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearOutputBtn = document.getElementById('clearOutputBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const loadSampleBtn = document.getElementById('loadSampleBtn');
    const importBtn = document.getElementById('importBtn');
    const exportBtn = document.getElementById('exportBtn');
    const shortcutsBtn = document.getElementById('shortcutsBtn');
    const shortcutsOverlay = document.getElementById('shortcutsOverlay');
    const beautifyMode = document.getElementById('beautifyMode');
    const minifyMode = document.getElementById('minifyMode');
    const inputError = document.getElementById('inputError');
    const errorMessage = document.getElementById('errorMessage');
    const fileInput = document.getElementById('fileInput');
    const toast = document.getElementById('toast');

    // Stats elements
    const keyCount = document.getElementById('keyCount');
    const maxDepth = document.getElementById('maxDepth');
    const charCount = document.getElementById('charCount');
    const formatTime = document.getElementById('formatTime');
    const formatStatus = document.getElementById('formatStatus');

    // State
    let isBeautifyMode = true;
    let lastCopied = '';

    // Sample JSON with escaped characters
    const sampleJson = {
      "key_sign": "D9mCnRmtEYhi0tAupmQnhjdB8TlRWRWMt1ZKM2GQPlu0X1uVXuPqrbxkat2mAa1imoLqmI4n0I44DdCv9bBYqV5LuNUaRD8ApruyCyIIzEXsg5BUNp8sRwFp4q0cKEyMQPOmg0vc88kVYgHAYiudqDIjMS3dGWKhmcoqldzK31Hlv5XuSw9Zt3zwAIjjniXwPnpxatRg0OJItI45JQXKpql1lMIsMtYn586lKqNKHwKGgZ4I6JGnoWQ7JKI3flISHRLF0n/rBj44PmVqYijAO986aAWI298nGisW+MDUdd0tTsYVzXV0AG9/q2Ip/WC6xcOMufGEczkzb2opXnJVCw==",
      "resp_code": "10000",
      "resp_msg": "请求成功",
      "resp_params": JSON.stringify({
        "wallet_act_info": {
          "wallet_act_no": "12602260000099579054",
          "wallet_act_balance": "0",
          "entity_card_no": "3569867843",
          "wallet_canbu_balance": "0"
        },
        "out_user_no": "61103679268260226165809030739139",
        "user_info": {
          "cert_no_secured": "",
          "cert_type": "0",
          "cert_no": "",
          "user_name": "罗世增",
          "campus": "0",
          "sex": "1",
          "class_id": "0",
          "class_admin_name": "",
          "face_user_id": "",
          "user_role": "1",
          "update_time": "2026-02-26 17:00:30",
          "user_mobile": "18878875434",
          "school_account": "2021030",
          "attach": "",
          "class_name": ""
        },
        "third_user_id": ""
      })
    };

    // JSON Statistics
    function getJsonStats(obj, depth = 0) {
      let keys = 0;
      let maxD = depth;

      if (obj && typeof obj === 'object') {
        const objKeys = Object.keys(obj);
        keys = objKeys.length;
        objKeys.forEach(key => {
          const result = getJsonStats(obj[key], depth + 1);
          keys += result.keys;
          maxD = Math.max(maxD, result.maxDepth);
        });
      }

      return { keys, maxDepth: maxD };
    }

    function updateStats(obj) {
      if (obj) {
        const stats = getJsonStats(obj);
        keyCount.textContent = stats.keys;
        maxDepth.textContent = stats.maxDepth;
        charCount.textContent = JSON.stringify(obj).length;
      } else {
        keyCount.textContent = '0';
        maxDepth.textContent = '0';
        charCount.textContent = '0';
      }
    }

    // Deep JSON formatter (handles escaped JSON strings)
    function deepFormatJson(obj) {
      if (typeof obj === 'string') {
        // Try to parse as JSON
        try {
          const parsed = JSON.parse(obj);
          return deepFormatJson(parsed);
        } catch (e) {
          return obj;
        }
      } else if (Array.isArray(obj)) {
        return obj.map(item => deepFormatJson(item));
      } else if (obj && typeof obj === 'object') {
        const result = {};
        for (const key in obj) {
          result[key] = deepFormatJson(obj[key]);
        }
        return result;
      }
      return obj;
    }

    // Format JSON
    function formatJson(input, minify = false) {
      try {
        // Parse the input JSON
        let data = JSON.parse(input);
        
        // Deep format to handle escaped JSON strings
        data = deepFormatJson(data);
        
        // Update stats
        updateStats(data);

        // Format output
        const output = minify 
          ? JSON.stringify(data)
          : JSON.stringify(data, null, 2);

        return {
          success: true,
          output: output,
          error: null
        };
      } catch (e) {
        return {
          success: false,
          output: '',
          error: e.message
        };
      }
    }

    // Show error
    function showError(msg) {
      errorMessage.textContent = msg;
      inputError.classList.add('visible');
    }

    // Hide error
    function hideError() {
      inputError.classList.remove('visible');
    }

    // Show toast
    function showToast(message, type = 'success') {
      toast.querySelector('.toast-icon').textContent = type === 'success' ? '✓' : '⚠';
      toast.querySelector('.toast-message').textContent = message;
      toast.className = `toast visible ${type}`;
      
      setTimeout(() => {
        toast.classList.remove('visible');
      }, 2000);
    }

    // Copy to clipboard
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('已复制到剪贴板');
      } catch (e) {
        showToast('复制失败', 'error');
      }
    }

    // Perform format
    function performFormat() {
      const input = inputJson.value.trim();
      
      if (!input) {
        showError('请输入 JSON 内容');
        return;
      }

      hideError();
      const startTime = performance.now();
      const result = formatJson(input, !isBeautifyMode);
      const endTime = performance.now();

      if (result.success) {
        outputJson.value = result.output;
        formatTime.textContent = `格式化耗时: ${(endTime - startTime).toFixed(2)}ms`;
        formatStatus.textContent = '✓ 成功';
        formatStatus.style.color = 'var(--accent-green)';
      } else {
        showError(`JSON 解析错误: ${result.error}`);
        formatStatus.textContent = '✕ 失败';
        formatStatus.style.color = 'var(--accent-red)';
      }
    }

    // Event Listeners
    formatBtn.addEventListener('click', performFormat);

    compressBtn.addEventListener('click', () => {
      const input = inputJson.value.trim();
      if (!input) return;
      
      const result = formatJson(input, true);
      if (result.success) {
        outputJson.value = result.output;
        showToast('已压缩');
      } else {
        showError(result.error);
      }
    });

    clearBtn.addEventListener('click', () => {
      inputJson.value = '';
      outputJson.value = '';
      hideError();
      updateStats(null);
      formatTime.textContent = '';
      formatStatus.textContent = '';
      inputJson.focus();
    });

    copyBtn.addEventListener('click', () => {
      const output = outputJson.value;
      if (output) {
        copyToClipboard(output);
      }
    });

    clearOutputBtn.addEventListener('click', () => {
      outputJson.value = '';
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        inputJson.value = text;
        hideError();
      } catch (e) {
        showToast('粘贴失败，请手动粘贴', 'error');
      }
    });

    loadSampleBtn.addEventListener('click', () => {
      inputJson.value = JSON.stringify(sampleJson, null, 2);
      hideError();
      showToast('已加载示例 JSON');
    });

    // Mode toggle
    beautifyMode.addEventListener('click', () => {
      isBeautifyMode = true;
      beautifyMode.classList.add('active');
      minifyMode.classList.remove('active');
    });

    minifyMode.addEventListener('click', () => {
      isBeautifyMode = false;
      minifyMode.classList.add('active');
      beautifyMode.classList.remove('active');
    });

    // File import/export
    importBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          inputJson.value = event.target.result;
          hideError();
          showToast(`已导入: ${file.name}`);
        };
        reader.readAsText(file);
        fileInput.value = '';
      }
    });

    exportBtn.addEventListener('click', () => {
      const output = outputJson.value;
      if (!output) {
        showToast('没有可导出的内容', 'error');
        return;
      }

      const blob = new Blob([output], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'formatted.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已导出: formatted.json');
    });

    // Shortcuts modal
    shortcutsBtn.addEventListener('click', () => {
      shortcutsOverlay.classList.add('visible');
    });

    shortcutsOverlay.addEventListener('click', (e) => {
      if (e.target === shortcutsOverlay) {
        shortcutsOverlay.classList.remove('visible');
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Ctrl + Enter - Format
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        performFormat();
      }

      // Ctrl + Shift + C - Copy output
      if (e.ctrlKey && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        if (outputJson.value) {
          copyToClipboard(outputJson.value);
        }
      }

      // Ctrl + L - Clear all
      if (e.ctrlKey && e.key === 'l') {
        e.preventDefault();
        inputJson.value = '';
        outputJson.value = '';
        hideError();
        updateStats(null);
        inputJson.focus();
      }

      // ? - Show shortcuts
      if (e.key === '?' && !e.ctrlKey && !e.shiftKey) {
        const activeElement = document.activeElement;
        if (activeElement !== inputJson && activeElement !== outputJson) {
          shortcutsOverlay.classList.add('visible');
        }
      }

      // Escape - Close modal
      if (e.key === 'Escape') {
        shortcutsOverlay.classList.remove('visible');
      }
    });

    // Real-time validation (optional, debounced)
    let debounceTimer;
    inputJson.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const value = inputJson.value.trim();
        if (value) {
          try {
            JSON.parse(value);
            hideError();
          } catch (e) {
            // Don't show error while typing, only after format
          }
        }
      }, 500);
    });

    // Focus input on load
    inputJson.focus();
  </script>
</body>
</html>
