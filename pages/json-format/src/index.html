<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter | JSON 格式化工具</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">{}</div>
      <div class="logo-text">JSON Formatter <span>/ 格式化工具</span></div>
    </div>
    <div class="header-actions">
      <button class="btn" id="shortcutsBtn" title="快捷键">⌨ 快捷键</button>
      <button class="btn" id="importBtn" title="导入文件">📁 导入</button>
      <button class="btn btn-success" id="exportBtn" title="导出文件">💾 导出</button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="tool-group">
      <button class="btn btn-primary" id="formatBtn">⚡ 格式化</button>
      <button class="btn" id="sortBtn">🔤 同级排序</button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tool-group">
      <span class="toolbar-label">显示:</span>
      <div class="mode-toggle">
        <button id="beautifyMode" class="active">美化</button>
        <button id="minifyMode">压缩</button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tool-group">
      <span class="toolbar-label">视图:</span>
      <div class="view-toggle">
        <button id="treeViewMode" class="active" title="树状结构视图">🌳 树状</button>
        <button id="textViewMode" title="格式化文本视图">📝 文本</button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tool-group">
      <span class="toolbar-label">操作:</span>
      <button class="btn" id="expandAllBtn" title="展开全部">⊞ 展开</button>
      <button class="btn" id="collapseAllBtn" title="折叠全部">⊟ 折叠</button>
      <button class="btn" id="copyAllBtn" title="复制全部">📋 复制</button>
      <button class="btn" id="clearBtn" title="清空">🗑 清空</button>
    </div>

    <div class="stats">
      <div class="stat-item"><span class="stat-dot keys"></span><span id="keyCount">0</span> 键</div>
      <div class="stat-item"><span class="stat-dot depth"></span><span id="maxDepth">0</span> 层</div>
      <div class="stat-item"><span class="stat-dot size"></span><span id="charCount">0</span> 字符</div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main">

    <!-- Input Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-indicator"></span>
          输入 JSON
        </div>
        <div class="panel-actions">
          <button class="icon-btn success" id="pasteBtn" title="粘贴">📋</button>
          <button class="icon-btn warning" id="loadSampleBtn" title="加载示例">📄</button>
        </div>
      </div>
      <div class="input-wrapper">
        <textarea 
          class="input-textarea" 
          id="inputJson"
          placeholder="在此粘贴或输入 JSON...&#10;&#10;支持转义字符和嵌套 JSON&#10;按 Ctrl+Enter 快速格式化"
          spellcheck="false"
        ></textarea>
      </div>
      <div class="error-bar" id="inputError">
        <span>⚠</span>
        <span id="errorMessage"></span>
      </div>
    </div>

    <!-- Output Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-indicator"></span>
          输出结果 <span id="sortIndicator" class="sort-indicator" style="display:none"></span>
        </div>
        <div class="panel-actions">
          <button class="icon-btn success" id="copyBtn" title="复制树">📋</button>
          <button class="icon-btn" id="copyRawBtn" title="复制原始JSON">📄</button>
        </div>
      </div>
      <div class="output-wrapper" id="outputWrapper">
        <div class="empty-state" id="emptyState">
          <div class="icon">{ }</div>
          <p>格式化后的 JSON 将显示在这里<br>支持树状视图和文本视图切换</p>
        </div>
        <div class="tree-node" id="treeOutput" style="display:none"></div>
        <pre class="text-output" id="textOutput" style="display:none"><code></code></pre>
      </div>
    </div>

  </main>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-item"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 格式化</div>
      <div class="status-item"><kbd>Ctrl</kbd>+<kbd>S</kbd> 同级排序</div>
      <div class="status-item"><kbd>←</kbd><kbd>→</kbd> 折叠/展开</div>
      <div class="status-item"><kbd>?</kbd> 快捷键</div>
    </div>
    <div class="status-right">
      <span id="formatStatus"></span>
      <span class="format-time" id="formatTime"></span>
    </div>
  </div>

  <!-- Shortcuts Modal -->
  <div class="shortcuts-overlay" id="shortcutsOverlay">
    <div class="shortcuts-modal">
      <h3>⌨ 快捷键</h3>
      <div class="shortcut-list">
        <div class="shortcut-item"><span>格式化 JSON</span><kbd>Ctrl + Enter</kbd></div>
        <div class="shortcut-item"><span>同级 ASCII 排序</span><kbd>Ctrl + S</kbd></div>
        <div class="shortcut-item"><span>复制输出</span><kbd>Ctrl + Shift + C</kbd></div>
        <div class="shortcut-item"><span>粘贴到输入</span><kbd>Ctrl + V</kbd></div>
        <div class="shortcut-item"><span>清空所有</span><kbd>Ctrl + L</kbd></div>
        <div class="shortcut-item"><span>展开全部</span><kbd>Ctrl + ]</kbd></div>
        <div class="shortcut-item"><span>折叠全部</span><kbd>Ctrl + [</kbd></div>
        <div class="shortcut-item"><span>关闭弹窗</span><kbd>Esc</kbd></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-message"></span>
  </div>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept=".json,.txt" style="display: none;">

  <script type="module" src="js/app.js"></script>
</body>
</html>
