<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨平台路径转换器 · Path Converter</title>
  <style>
    /* =========================================================
       shadcn/ui Design Tokens (Zinc Neutral)
       极简黑白灰阶、紧凑微圆角、精细 1px 边框、排版驱动
       ========================================================= */
    :root, [data-theme="dark"] {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #111113;
      --card-foreground: #fafafa;
      --popover: #111113;
      --popover-foreground: #fafafa;
      --primary: #fafafa;
      --primary-foreground: #09090b;
      --secondary: #18181b;
      --secondary-foreground: #fafafa;
      --muted: #1c1c20;
      --muted-foreground: #a1a1aa;
      --accent: #27272a;
      --accent-foreground: #fafafa;
      --destructive: #ef4444;
      --border: #27272a;
      --border-subtle: #1e1e22;
      --input: #18181b;
      --ring: #d4d4d8;
      --success: #10b981;
      --success-muted: rgba(16, 185, 129, 0.15);
      --radius: 6px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    [data-theme="light"] {
      --background: #ffffff;
      --foreground: #09090b;
      --card: #ffffff;
      --card-foreground: #09090b;
      --popover: #ffffff;
      --popover-foreground: #09090b;
      --primary: #09090b;
      --primary-foreground: #fafafa;
      --secondary: #f4f4f5;
      --secondary-foreground: #09090b;
      --muted: #f4f4f5;
      --muted-foreground: #64748b;
      --accent: #e4e4e7;
      --accent-foreground: #09090b;
      --destructive: #dc2626;
      --border: #e4e4e7;
      --border-subtle: #eeeeef;
      --input: #f4f4f5;
      --ring: #09090b;
      --success: #059669;
      --success-muted: rgba(5, 150, 105, 0.12);
      --radius: 6px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--foreground);
      color: var(--background);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--muted);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted-foreground);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 顶栏 Header: 极致紧凑单行 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-mono);
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      line-height: 1.2;
    }

    .badge-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* shadcn Tabs 控件 */
    .tabs-list {
      display: inline-flex;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      background-color: var(--muted);
      padding: 3px;
      color: var(--muted-foreground);
    }

    .tab-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: calc(var(--radius) - 2px);
      height: 28px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      transition: all 0.15s ease;
      gap: 5px;
    }

    .tab-trigger:hover {
      color: var(--foreground);
    }

    .tab-trigger.active {
      background-color: var(--background);
      color: var(--foreground);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    /* 主题微调器 */
    .theme-toggle {
      display: inline-flex;
      height: 34px;
      background: var(--muted);
      border-radius: var(--radius);
      padding: 3px;
      gap: 2px;
      align-items: center;
    }

    .theme-btn {
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      height: 28px;
      padding: 0 9px;
      font-size: 12px;
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.12s;
    }

    .theme-btn:hover {
      color: var(--foreground);
    }

    .theme-btn.active {
      background: var(--background);
      color: var(--foreground);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* 面板卡片: 紧凑，无多余外边距 */
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 输入组 Input Group */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      position: relative;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrapper:focus-within {
      border-color: var(--ring);
      box-shadow: 0 0 0 1px var(--ring);
    }

    .input-icon-prefix {
      display: flex;
      align-items: center;
      padding-left: 10px;
      color: var(--muted-foreground);
      flex-shrink: 0;
    }

    input[type="text"], textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-feature-settings: "tnum" 1, "cv02" 1;
      padding: 7px 10px;
    }

    .input-actions-suffix {
      display: flex;
      align-items: center;
      padding-right: 6px;
      gap: 4px;
      flex-shrink: 0;
    }

    /* shadcn 按钮组件 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: calc(var(--radius) - 2px);
      font-size: 12px;
      font-weight: 500;
      height: 26px;
      padding: 0 9px;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--secondary);
      color: var(--secondary-foreground);
      transition: all 0.12s ease;
      gap: 5px;
      user-select: none;
    }

    .btn:hover {
      background-color: var(--accent);
      border-color: var(--muted-foreground);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-ghost {
      background-color: transparent;
      border-color: transparent;
      color: var(--muted-foreground);
    }

    .btn-ghost:hover {
      background-color: var(--accent);
      color: var(--foreground);
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
      font-weight: 600;
    }

    .btn-primary:hover {
      opacity: 0.92;
      background-color: var(--primary);
    }

    .btn-xs {
      height: 24px;
      padding: 0 7px;
      font-size: 12px;
    }

    /* 工具条 Toolbar: 极简紧凑单行 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12.5px;
      color: var(--muted-foreground);
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-size: 12.5px;
    }

    .checkbox-input {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background-color: var(--input);
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      transition: all 0.1s;
    }

    .checkbox-input:checked {
      background-color: var(--foreground);
      border-color: var(--foreground);
    }

    .checkbox-input:checked::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--background);
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    select.select-compact {
      background: var(--input);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      padding: 2px 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    /* 紧凑结果网格列表 (Compact Result Rows) */
    .result-table {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
    }

    .result-row {
      display: grid;
      grid-template-columns: 210px 1fr 76px;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 10px;
      transition: background-color 0.1s;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-row:hover {
      background-color: var(--muted);
    }

    .result-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .result-badge {
      font-size: 12px;
      font-family: var(--font-mono);
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
      color: var(--muted-foreground);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .result-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-code-container {
      position: relative;
      background: var(--input);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      min-width: 0;
      cursor: pointer;
    }

    .result-code-container:hover {
      border-color: var(--muted-foreground);
    }

    .result-code {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: all;
      font-feature-settings: "tnum" 1;
    }

    .copy-btn {
      height: 24px;
      padding: 0 8px;
      font-size: 12px;
      border-radius: 4px;
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.12s;
      white-space: nowrap;
      user-select: none;
    }

    .copy-btn:hover {
      color: var(--foreground);
      border-color: var(--muted-foreground);
      background: var(--accent);
    }

    .copy-btn.copied {
      background: var(--success-muted);
      color: var(--success);
      border-color: var(--success);
      font-weight: 600;
    }

    /* 空状态 */
    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted-foreground);
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* 批量模式 */
    .batch-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .batch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 720px) {
      .batch-grid {
        grid-template-columns: 1fr;
      }
      .result-row {
        grid-template-columns: 150px 1fr 68px;
      }
    }

    .batch-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .batch-col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    textarea.batch-textarea {
      width: 100%;
      height: 260px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea.batch-textarea:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 1px var(--ring);
    }

    /* 页脚 */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 2px;
      font-size: 12px;
      color: var(--muted-foreground);
      border-top: 1px solid var(--border);
    }

    kbd {
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--foreground);
    }

    /* SVG 矢量图标 */
    .icon {
      width: 13px;
      height: 13px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header 顶栏: 极致紧凑设计 -->
    <header>
      <div class="brand-section">
        <svg class="icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24">
          <polyline points="4 17 10 11 4 5"/>
          <line x1="12" y1="19" x2="20" y2="19"/>
        </svg>
        <span class="brand-title">Path Converter</span>
        <span class="badge">v2.2</span>
      </div>

      <div class="header-controls">
        <!-- shadcn Tabs 触发器 -->
        <div class="tabs-list" role="tablist">
          <button class="tab-trigger active" id="tabSingleBtn" onclick="switchTab('single')">
            单路径即时转换
          </button>
          <button class="tab-trigger" id="tabBatchBtn" onclick="switchTab('batch')">
            批量转换
          </button>
        </div>

        <!-- 主题切换 -->
        <div class="theme-toggle" role="radiogroup" aria-label="主题">
          <button class="theme-btn" id="themeBtn-auto" onclick="setTheme('auto')" title="跟随系统">系统</button>
          <button class="theme-btn" id="themeBtn-light" onclick="setTheme('light')" title="浅色">浅色</button>
          <button class="theme-btn" id="themeBtn-dark" onclick="setTheme('dark')" title="深色">深色</button>
        </div>
      </div>
    </header>

    <!-- 单路径面板 (Single Mode) -->
    <div id="singlePanel" class="card">
      <div class="input-box">
        <div class="input-meta-bar">
          <span>输入源路径（支持跨平台任意格式）：</span>
          <div style="display: flex; gap: 6px; align-items: center;">
            <span class="badge" id="pathInspectorBadge">等待输入</span>
            <button class="btn btn-xs btn-ghost" onclick="pasteFromClipboard()" title="从剪贴板读取">
              <svg class="icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              粘贴
            </button>
          </div>
        </div>

        <div class="input-wrapper">
          <span class="input-icon-prefix">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" id="singleInput" placeholder="输入 Windows / WSL / Git Bash / URI 路径，例如 E:\code\repo" autofocus spellcheck="false">
          <div class="input-actions-suffix">
            <button class="btn btn-xs btn-ghost" onclick="clearInput()" title="清空 (Esc)">清空</button>
          </div>
        </div>
      </div>

      <!-- 紧凑工具栏 (Toolbar) -->
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="checkbox-label">
            <span>尾斜杠:</span>
            <select class="select-compact" id="trailingSlashOption" onchange="updateAll()">
              <option value="none">移除尾斜杠 (dir)</option>
              <option value="add">强制加尾斜杠 (dir/)</option>
              <option value="keep">跟随原样</option>
            </select>
          </label>
          <label class="checkbox-label" title="含空格路径自动包裹双引号">
            <input type="checkbox" class="checkbox-input" id="quoteOption" onchange="updateAll()">
            <span>包裹双引号 ("...")</span>
          </label>
          <label class="checkbox-label" title="盘符大写">
            <input type="checkbox" class="checkbox-input" id="upperDriveOption" checked onchange="updateAll()">
            <span>盘符大写</span>
          </label>
        </div>
        <div style="font-size: 11px; color: var(--muted-foreground);">
          按 <kbd>Enter</kbd> 快速复制首项
        </div>
      </div>

      <!-- 紧凑结果网格列表 (Result Rows) -->
      <div class="result-table" id="resultsTable">
        <!-- 动态生成 8 种格式 -->
      </div>
    </div>

    <!-- 批量转换面板 (Batch Mode) -->
    <div id="batchPanel" class="card batch-panel" style="display: none;">
      <div class="toolbar" style="padding-top: 0; border-top: none;">
        <div class="toolbar-group">
          <span>批量目标格式：</span>
          <select class="select-compact" id="batchTargetFormat" onchange="convertBatch()">
            <option value="win_slash">Windows 标准反斜杠 (E:\...)</option>
            <option value="posix_slash">跨平台标准正斜杠 (E:/...)</option>
            <option value="file_uri">File URI 协议 (file:///E:/...)</option>
            <option value="git_bash">Git Bash 格式 (/e/...)</option>
            <option value="wsl">WSL 路径 (/mnt/e/...)</option>
            <option value="win_double_slash">转义双反斜杠 (E:\\...)</option>
            <option value="lead_slash">前缀单正斜杠 (/E:/...)</option>
            <option value="lead_double_slash">前缀双正斜杠 (//E://...)</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="convertBatch()">
          <svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          执行转换
        </button>
      </div>

      <div class="batch-grid">
        <div class="batch-col">
          <div class="batch-col-header">
            <span>输入多行路径：</span>
            <div style="display: flex; gap: 6px; align-items: center;">
              <span id="batchCountBadge" class="badge">0 行</span>
              <button class="btn btn-xs btn-ghost" onclick="pasteBatchFromClipboard()">粘贴</button>
            </div>
          </div>
          <textarea class="batch-textarea" id="batchInput" placeholder="每行一个路径，自动保留格式..." spellcheck="false" oninput="updateBatchStats()"></textarea>
        </div>

        <div class="batch-col">
          <div class="batch-col-header">
            <span>转换结果输出：</span>
            <button class="btn btn-xs" id="batchCopyBtn" onclick="copyBatchResult()">
              <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              复制全部
            </button>
          </div>
          <textarea class="batch-textarea" id="batchOutput" readonly placeholder="转换后的内容将实时呈现在这里..." spellcheck="false"></textarea>
        </div>
      </div>
    </div>

    <!-- 页脚与键盘指引 -->
    <footer>
      <div>
        <span>快捷操作：</span>
        <kbd>Esc</kbd> <span>清空</span> · <kbd>Enter</kbd> <span>复制首项</span>
      </div>
      <div>
        <span>单文件 HTML · 原生运行 · 无外部依赖</span>
      </div>
    </footer>
  </div>

  <script>
    // --- 主题控制逻辑 ---
    const THEME_KEY = "path_converter_theme_pref";

    function initTheme() {
      const savedPref = localStorage.getItem(THEME_KEY) || "auto";
      setTheme(savedPref, false);

      const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
      mediaQuery.addEventListener("change", (e) => {
        const currentPref = localStorage.getItem(THEME_KEY) || "auto";
        if (currentPref === "auto") {
          applyTheme(e.matches ? "dark" : "light");
        }
      });
    }

    function setTheme(pref, persist = true) {
      if (persist) localStorage.setItem(THEME_KEY, pref);

      document.querySelectorAll(".theme-btn").forEach(btn => btn.classList.remove("active"));
      const targetBtn = document.getElementById(`themeBtn-${pref}`);
      if (targetBtn) targetBtn.classList.add("active");

      if (pref === "auto") {
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(isDark ? "dark" : "light");
      } else {
        applyTheme(pref);
      }
    }

    function applyTheme(actualTheme) {
      document.documentElement.setAttribute("data-theme", actualTheme);
    }

    initTheme();

    // --- 8 种平台目标格式字典 ---
    const FORMAT_DEFS = [
      {
        id: "win_slash",
        name: "Windows 反斜杠",
        badge: "Win",
        generate: (d, parts, trailing) => {
          let p = (d ? d + "\\" : "\\") + parts.join("\\");
          if (trailing && !p.endsWith("\\")) p += "\\";
          return p;
        }
      },
      {
        id: "posix_slash",
        name: "跨平台正斜杠",
        badge: "POSIX",
        generate: (d, parts, trailing) => {
          let p = (d ? d + "/" : "/") + parts.join("/");
          if (trailing && !p.endsWith("/")) p += "/";
          return p;
        }
      },
      {
        id: "file_uri",
        name: "File URI 协议",
        badge: "URI",
        generate: (d, parts, trailing) => {
          let p = "file:///" + (d ? d + "/" : "") + parts.join("/");
          if (trailing && !p.endsWith("/")) p += "/";
          return p;
        }
      },
      {
        id: "git_bash",
        name: "Git Bash / MSYS",
        badge: "Bash",
        generate: (d, parts, trailing) => {
          let driveLetter = d ? d.replace(":", "").toLowerCase() : "";
          let p = (driveLetter ? "/" + driveLetter + "/" : "/") + parts.join("/");
          if (trailing && !p.endsWith("/")) p += "/";
          return p;
        }
      },
      {
        id: "wsl",
        name: "WSL Linux 挂载",
        badge: "WSL",
        generate: (d, parts, trailing) => {
          let driveLetter = d ? d.replace(":", "").toLowerCase() : "";
          let p = (driveLetter ? "/mnt/" + driveLetter + "/" : "/") + parts.join("/");
          if (trailing && !p.endsWith("/")) p += "/";
          return p;
        }
      },
      {
        id: "win_double_slash",
        name: "转义双反斜杠",
        badge: "Escaped",
        generate: (d, parts, trailing) => {
          let p = (d ? d + "\\\\" : "\\\\") + parts.join("\\\\");
          if (trailing && !p.endsWith("\\\\")) p += "\\\\";
          return p;
        }
      },
      {
        id: "lead_slash",
        name: "前缀单正斜杠",
        badge: "Lead /",
        generate: (d, parts, trailing) => {
          let p = "/" + (d ? d + "/" : "") + parts.join("/");
          if (trailing && !p.endsWith("/")) p += "/";
          return p;
        }
      },
      {
        id: "lead_double_slash",
        name: "前缀双正斜杠",
        badge: "Lead //",
        generate: (d, parts, trailing) => {
          let p = "//" + (d ? d + "//" : "") + parts.join("//");
          if (trailing && !p.endsWith("//")) p += "//";
          return p;
        }
      }
    ];

    // --- 路径分析核心 ---
    function parsePath(raw) {
      if (!raw) return null;
      let str = raw.trim();
      if (!str) return null;

      let detectedKind = "标准路径";
      let hadTrailing = /[\/\\]$/.test(str);

      if ((str.startsWith('"') && str.endsWith('"')) || (str.startsWith("'") && str.endsWith("'"))) {
        str = str.slice(1, -1).trim();
      }

      if (str.startsWith("file:///")) {
        detectedKind = "File URI";
        str = str.slice(8);
      } else if (str.startsWith("file://")) {
        detectedKind = "File URI";
        str = str.slice(7);
      }

      let wslMatch = str.match(/^\/mnt\/([a-zA-Z])([\/\\]+.*)?$/);
      if (wslMatch) {
        detectedKind = "WSL 挂载";
        let drive = wslMatch[1] + ":";
        let rest = wslMatch[2] || "";
        str = drive + rest;
      }

      let gitBashMatch = str.match(/^\/([a-zA-Z])([\/\\]+.*)?$/);
      if (gitBashMatch && !wslMatch) {
        detectedKind = "Git Bash";
        let drive = gitBashMatch[1] + ":";
        let rest = gitBashMatch[2] || "";
        str = drive + rest;
      }

      if (/^[\/\\]+[a-zA-Z]:/.test(str)) {
        detectedKind = "前缀斜杠";
        str = str.replace(/^[\/\\]+([a-zA-Z]:)/, '$1');
      }

      let driveMatch = str.match(/^([a-zA-Z]:)(.*)$/);
      let drive = "";
      let rest = str;
      if (driveMatch) {
        drive = driveMatch[1];
        rest = driveMatch[2];
        if (detectedKind === "标准路径") {
          detectedKind = str.includes("\\") ? "Win 反斜杠" : "POSIX 正斜杠";
        }
      }

      let parts = rest.split(/[\/\\]+/).filter(p => p.length > 0);

      return {
        drive,
        parts,
        hadTrailing,
        detectedKind
      };
    }

    function formatPath(parsed, formatDef, trailingOption, quoteOption, upperDriveOption) {
      let drive = parsed.drive;
      if (drive) {
        drive = upperDriveOption ? drive.toUpperCase() : drive.toLowerCase();
      }

      let shouldTrailing = false;
      if (trailingOption === "add") shouldTrailing = true;
      else if (trailingOption === "none") shouldTrailing = false;
      else if (trailingOption === "keep") shouldTrailing = parsed.hadTrailing;

      let res = formatDef.generate(drive, parsed.parts, shouldTrailing);
      if (quoteOption) res = `"${res}"`;
      return res;
    }

    // 复制支持
    function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      } else {
        return new Promise((resolve, reject) => {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          textarea.style.top = "-9999px";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            const success = document.execCommand('copy');
            document.body.removeChild(textarea);
            if (success) resolve();
            else reject(new Error('copy failed'));
          } catch (e) {
            document.body.removeChild(textarea);
            reject(e);
          }
        });
      }
    }

    // 渲染单路径转换
    function updateAll() {
      const inputEl = document.getElementById("singleInput");
      const input = inputEl.value;
      const tableEl = document.getElementById("resultsTable");
      const trailingOption = document.getElementById("trailingSlashOption").value;
      const quoteOption = document.getElementById("quoteOption").checked;
      const upperDriveOption = document.getElementById("upperDriveOption").checked;
      const badgeEl = document.getElementById("pathInspectorBadge");

      const parsed = parsePath(input);
      if (!parsed) {
        badgeEl.textContent = "等待输入";
        tableEl.innerHTML = `
          <div class="empty-state">
            <svg class="icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>输入或粘贴路径，即时生成并一键复制 8 种主流目标格式</span>
          </div>
        `;
        return;
      }

      badgeEl.textContent = parsed.detectedKind;

      let html = "";
      FORMAT_DEFS.forEach((fmt) => {
        const val = formatPath(parsed, fmt, trailingOption, quoteOption, upperDriveOption);
        const escaped = escapeHtml(val);
        html += `
          <div class="result-row">
            <div class="result-info">
              <span class="result-badge">${fmt.badge}</span>
              <span class="result-name" title="${fmt.name}">${fmt.name}</span>
            </div>
            <div class="result-code-container" onclick="copyRowCode(this)" title="单击快速复制">
              <span class="result-code">${escaped}</span>
            </div>
            <button class="copy-btn" onclick="copyRowBtn(this)">
              <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>复制</span>
            </button>
          </div>
        `;
      });
      tableEl.innerHTML = html;
    }

    function copyRowBtn(btn) {
      const codeSpan = btn.previousElementSibling.querySelector(".result-code");
      const text = codeSpan.textContent;
      writeClipboard(text).then(() => {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span>已复制</span>
        `;
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.classList.remove("copied");
        }, 1200);
      });
    }

    function copyRowCode(container) {
      const btn = container.nextElementSibling;
      if (btn) copyRowBtn(btn);
    }

    // 批量逻辑
    function updateBatchStats() {
      const rawText = document.getElementById("batchInput").value;
      const lines = rawText ? rawText.split(/\r?\n/).filter(l => l.trim().length > 0).length : 0;
      document.getElementById("batchCountBadge").textContent = `${lines} 行`;
    }

    function convertBatch() {
      const rawText = document.getElementById("batchInput").value;
      const targetFmtId = document.getElementById("batchTargetFormat").value;
      const trailingOption = document.getElementById("trailingSlashOption").value;
      const quoteOption = document.getElementById("quoteOption").checked;
      const upperDriveOption = document.getElementById("upperDriveOption").checked;

      const fmt = FORMAT_DEFS.find(f => f.id === targetFmtId) || FORMAT_DEFS[0];
      const lines = rawText.split(/\r?\n/);
      const converted = [];

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) {
          converted.push("");
          return;
        }
        let parsed = parsePath(trimmed);
        if (parsed) {
          converted.push(formatPath(parsed, fmt, trailingOption, quoteOption, upperDriveOption));
        } else {
          converted.push(line);
        }
      });

      document.getElementById("batchOutput").value = converted.join("\n");
      updateBatchStats();
    }

    function copyBatchResult() {
      const text = document.getElementById("batchOutput").value;
      if (!text) return;
      writeClipboard(text).then(() => {
        const btn = document.getElementById("batchCopyBtn");
        const orig = btn.innerHTML;
        btn.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span>已复制全部</span>
        `;
        btn.classList.add("btn-primary");
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.classList.remove("btn-primary");
        }, 1300);
      });
    }

    function clearInput() {
      const input = document.getElementById("singleInput");
      input.value = "";
      input.focus();
      updateAll();
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById("singleInput").value = text.trim();
          updateAll();
        }
      } catch (err) {
        alert("浏览器未授权读取剪贴板，请使用 Ctrl+V 粘贴。");
      }
    }

    async function pasteBatchFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById("batchInput").value = text;
          updateBatchStats();
          convertBatch();
        }
      } catch (err) {
        alert("浏览器未授权读取剪贴板，请使用 Ctrl+V 粘贴。");
      }
    }

    function switchTab(tab) {
      const singlePanel = document.getElementById("singlePanel");
      const batchPanel = document.getElementById("batchPanel");
      const tabSingleBtn = document.getElementById("tabSingleBtn");
      const tabBatchBtn = document.getElementById("tabBatchBtn");

      if (tab === 'single') {
        singlePanel.style.display = "flex";
        batchPanel.style.display = "none";
        tabSingleBtn.classList.add("active");
        tabBatchBtn.classList.remove("active");
      } else {
        singlePanel.style.display = "none";
        batchPanel.style.display = "flex";
        tabBatchBtn.classList.add("active");
        tabSingleBtn.classList.remove("active");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") clearInput();
      if (e.key === "Enter" && document.activeElement.id === "singleInput") {
        const firstBtn = document.querySelector(".copy-btn");
        if (firstBtn) copyRowBtn(firstBtn);
      }
    });

    document.getElementById("singleInput").addEventListener("input", updateAll);

    // 预设测试用例
    document.getElementById("singleInput").value = "E:\\program_green_win_lib\\java\\jdk7";
    updateAll();
  </script>
</body>
</html>
