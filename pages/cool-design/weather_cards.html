<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Weather Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            height: 350px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .weather-card:hover {
            transform: translateY(-5px);
        }

        .weather-icon {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 20px;
        }

        .weather-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .weather-temp {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .weather-desc {
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
        }

        /* Wind Animation */
        .wind-card {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.3), rgba(48, 71, 94, 0.3));
        }

        .wind-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .wind-line {
            position: absolute;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 1px;
            animation: windMove 3s linear infinite;
        }

        .wind-line:nth-child(1) {
            top: 20%;
            width: 40px;
            animation-delay: 0s;
        }

        .wind-line:nth-child(2) {
            top: 35%;
            width: 60px;
            animation-delay: 0.5s;
        }

        .wind-line:nth-child(3) {
            top: 50%;
            width: 30px;
            animation-delay: 1s;
        }

        .wind-line:nth-child(4) {
            top: 65%;
            width: 50px;
            animation-delay: 1.5s;
        }

        @keyframes windMove {
            0% {
                left: -60px;
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        .wind-icon {
            color: #87CEEB;
            font-size: 60px;
            animation: windSway 2s ease-in-out infinite alternate;
        }

        @keyframes windSway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* Rain Animation */
        .rain-card {
            background: linear-gradient(135deg, rgba(52, 73, 94, 0.3), rgba(44, 62, 80, 0.3));
        }

        .rain-drops {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .rain-drop {
            position: absolute;
            width: 2px;
            height: 15px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.8), rgba(135, 206, 235, 0.4));
            border-radius: 0 0 2px 2px;
            animation: rainFall 1s linear infinite;
        }

        .rain-drop:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 0.8s; }
        .rain-drop:nth-child(2) { left: 20%; animation-delay: 0.2s; animation-duration: 1.2s; }
        .rain-drop:nth-child(3) { left: 30%; animation-delay: 0.4s; animation-duration: 0.9s; }
        .rain-drop:nth-child(4) { left: 40%; animation-delay: 0.1s; animation-duration: 1.1s; }
        .rain-drop:nth-child(5) { left: 50%; animation-delay: 0.3s; animation-duration: 1s; }
        .rain-drop:nth-child(6) { left: 60%; animation-delay: 0.5s; animation-duration: 0.7s; }
        .rain-drop:nth-child(7) { left: 70%; animation-delay: 0.7s; animation-duration: 1.3s; }
        .rain-drop:nth-child(8) { left: 80%; animation-delay: 0.9s; animation-duration: 0.6s; }
        .rain-drop:nth-child(9) { left: 90%; animation-delay: 0.6s; animation-duration: 1.4s; }

        @keyframes rainFall {
            0% {
                top: -20px;
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0.3;
            }
        }

        .rain-icon {
            color: #87CEEB;
            font-size: 60px;
        }

        /* Sun Animation */
        .sun-card {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.3), rgba(255, 152, 0, 0.3));
        }

        .sun-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            animation: sunRotate 8s linear infinite;
        }

        .sun-ray {
            position: absolute;
            width: 3px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 0.8), transparent);
            border-radius: 2px;
            top: 0;
            left: 50%;
            transform-origin: 1.5px 60px;
        }

        .sun-ray:nth-child(1) { transform: translateX(-50%) rotate(0deg); }
        .sun-ray:nth-child(2) { transform: translateX(-50%) rotate(45deg); }
        .sun-ray:nth-child(3) { transform: translateX(-50%) rotate(90deg); }
        .sun-ray:nth-child(4) { transform: translateX(-50%) rotate(135deg); }
        .sun-ray:nth-child(5) { transform: translateX(-50%) rotate(180deg); }
        .sun-ray:nth-child(6) { transform: translateX(-50%) rotate(225deg); }
        .sun-ray:nth-child(7) { transform: translateX(-50%) rotate(270deg); }
        .sun-ray:nth-child(8) { transform: translateX(-50%) rotate(315deg); }

        @keyframes sunRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .sun-icon {
            color: #FFD700;
            font-size: 60px;
            animation: sunPulse 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 2;
        }

        @keyframes sunPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Snow Animation */
        .snow-card {
            background: linear-gradient(135deg, rgba(176, 196, 222, 0.3), rgba(230, 230, 250, 0.3));
        }

        .snowflakes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            animation: snowFall linear infinite;
        }

        .snowflake:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 3s; }
        .snowflake:nth-child(2) { left: 20%; animation-delay: 0.5s; animation-duration: 4s; }
        .snowflake:nth-child(3) { left: 30%; animation-delay: 1s; animation-duration: 3.5s; }
        .snowflake:nth-child(4) { left: 40%; animation-delay: 1.5s; animation-duration: 5s; }
        .snowflake:nth-child(5) { left: 50%; animation-delay: 2s; animation-duration: 2.5s; }
        .snowflake:nth-child(6) { left: 60%; animation-delay: 2.5s; animation-duration: 4.5s; }
        .snowflake:nth-child(7) { left: 70%; animation-delay: 3s; animation-duration: 3s; }
        .snowflake:nth-child(8) { left: 80%; animation-delay: 3.5s; animation-duration: 4s; }
        .snowflake:nth-child(9) { left: 90%; animation-delay: 4s; animation-duration: 3.5s; }

        @keyframes snowFall {
            0% {
                top: -10px;
                opacity: 1;
                transform: translateX(0px) rotate(0deg);
            }
            100% {
                top: 100%;
                opacity: 0.3;
                transform: translateX(30px) rotate(360deg);
            }
        }

        .snow-icon {
            color: #E6E6FA;
            font-size: 60px;
        }

        .title {
            margin-bottom: 40px;
            text-align: center;
            font-size: 32px;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <h1 class="title">Animated Weather Cards</h1>
    
    <div class="container">
        <!-- Wind Card -->
        <div class="weather-card wind-card">
            <div class="wind-lines">
                <div class="wind-line"></div>
                <div class="wind-line"></div>
                <div class="wind-line"></div>
                <div class="wind-line"></div>
            </div>
            <div class="weather-icon">
                <div class="wind-icon">💨</div>
            </div>
            <div class="weather-title">Windy</div>
            <div class="weather-temp">18°C</div>
            <div class="weather-desc">Breezy with gusts up to 25 mph</div>
        </div>

        <!-- Rain Card -->
        <div class="weather-card rain-card">
            <div class="rain-drops">
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
            </div>
            <div class="weather-icon">
                <div class="rain-icon">🌧️</div>
            </div>
            <div class="weather-title">Rainy</div>
            <div class="weather-temp">12°C</div>
            <div class="weather-desc">Light rain with occasional showers</div>
        </div>

        <!-- Sun Card -->
        <div class="weather-card sun-card">
            <div class="sun-rays">
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
                <div class="sun-ray"></div>
            </div>
            <div class="weather-icon">
                <div class="sun-icon">☀️</div>
            </div>
            <div class="weather-title">Sunny</div>
            <div class="weather-temp">25°C</div>
            <div class="weather-desc">Clear skies with bright sunshine</div>
        </div>

        <!-- Snow Card -->
        <div class="weather-card snow-card">
            <div class="snowflakes">
                <div class="snowflake">❄️</div>
                <div class="snowflake">❅</div>
                <div class="snowflake">❄️</div>
                <div class="snowflake">❅</div>
                <div class="snowflake">❄️</div>
                <div class="snowflake">❅</div>
                <div class="snowflake">❄️</div>
                <div class="snowflake">❅</div>
                <div class="snowflake">❄️</div>
            </div>
            <div class="weather-icon">
                <div class="snow-icon">🌨️</div>
            </div>
            <div class="weather-title">Snowy</div>
            <div class="weather-temp">-2°C</div>
            <div class="weather-desc">Light snowfall with accumulation</div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn active" onclick="toggleAnimations('all', this)">Show All</button>
        <button class="control-btn" onclick="toggleAnimations('wind', this)">Wind Only</button>
        <button class="control-btn" onclick="toggleAnimations('rain', this)">Rain Only</button>
        <button class="control-btn" onclick="toggleAnimations('sun', this)">Sun Only</button>
        <button class="control-btn" onclick="toggleAnimations('snow', this)">Snow Only</button>
    </div>

    <script>
        let currentWeather = 'all';
        
        function toggleAnimations(weather, clickedButton) {
            const cards = document.querySelectorAll('.weather-card');
            const buttons = document.querySelectorAll('.control-btn');
            
            // Update active button
            buttons.forEach(btn => btn.classList.remove('active'));
            if (clickedButton) {
                clickedButton.classList.add('active');
            }
            
            currentWeather = weather;
            
            if (weather === 'all') {
                // Show all cards
                cards.forEach(card => {
                    card.style.display = 'flex';
                });
                document.querySelector('.container').style.gridTemplateColumns = 'repeat(auto-fit, minmax(280px, 1fr))';
            } else {
                // Hide all cards first
                cards.forEach(card => {
                    card.style.display = 'none';
                });
                
                // Show only selected weather card
                const selectedCard = document.querySelector(`.${weather}-card`);
                if (selectedCard) {
                    selectedCard.style.display = 'flex';
                    document.querySelector('.container').style.gridTemplateColumns = '1fr';
                    document.querySelector('.container').style.justifyContent = 'center';
                }
            }
        }

        // Add some interactive effects
        document.querySelectorAll('.weather-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.boxShadow = '0 10px 30px rgba(255, 255, 255, 0.1)';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.boxShadow = 'none';
            });
        });

        // Initialize with all cards visible
        toggleAnimations('all');
    </script>
</body>
</html>
